name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: sh scripts/check.sh --kit-only
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: flix-bridge/lib
          key: flix-jars-${{ hashFiles('flix-bridge/resources/dev/flixw/sdk/bridge/versions.json') }}
      - run: sh scripts/check.sh
